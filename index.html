<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 투자 관리 & AI 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --up-red: #ef4444;
      --down-blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; min-height: 100vh; }
    
    header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 0.8rem 1rem; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1400px; margin: 0 auto; flex-wrap: wrap; gap: 0.5rem; }
    .brand { font-weight: bold; font-size: 1.1rem; }
    .date-control { display: flex; gap: 0.5rem; align-items: center; }
    
    input[type="date"], input[type="password"], input[type="text"], select, textarea {
      background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color);
      padding: 0.4rem; border-radius: 6px; font-size: 0.85rem;
    }
    .btn { background: var(--primary); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    .btn-secondary { background: #475569; }

    /* Ticker */
    .ticker-bar { background-color: #020617; border-bottom: 1px solid var(--border-color); padding: 0.4rem 1rem; overflow-x: auto; white-space: nowrap; }
    .ticker-container { display: flex; gap: 1.5rem; max-width: 1400px; margin: 0 auto; }
    .ticker-item { font-size: 0.8rem; display: flex; gap: 0.4rem; }
    .ticker-name { color: var(--text-muted); }
    .ticker-val.up { color: var(--up-red); font-weight: bold; }
    .ticker-val.down { color: var(--down-blue); font-weight: bold; }

    .app-container { max-width: 1400px; margin: 1rem auto; padding: 0 1rem; width: 100%; flex: 1; }
    .grid-layout { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1rem; margin-bottom: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1rem; }
    .card-title { font-size: 0.95rem; font-weight: bold; margin-bottom: 0.8rem; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; }

    /* Tables & Charts */
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: right; padding: 0.5rem; border-bottom: 1px solid var(--border-color); }
    th:first-child, td:first-child { text-align: left; }
    th { color: var(--text-muted); font-weight: 500; }
    .chart-box { height: 200px; width: 100%; position: relative; }

    footer { background-color: var(--card-bg); border-top: 1px solid var(--border-color); padding: 0.8rem 1rem; margin-top: auto; }
    .footer-content { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; font-size: 0.8rem; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="brand">📈 통합 투자 관리 & AI 분석</div>
      <div class="date-control">
        <input type="date" id="baseDate">
        <button class="btn" onclick="fetchDataForDate()">🔄 불러오기</button>
      </div>
    </div>
  </header>

  <!-- 실시간 지수 띠 (Ticker) -->
  <div class="ticker-bar">
    <div class="ticker-container" id="macroTicker">
      <div style="font-size:0.8rem; color:var(--text-muted);">🔑 하단에서 Gemini API 키를 입력하고 저장해 주세요.</div>
    </div>
  </div>

  <div class="app-container">
    <main class="grid-layout">
      
      <!-- 포트폴리오 현황 -->
      <section class="card">
        <div class="card-title">
          <span>📊 핵심 ETF 포트폴리오</span>
          <span style="font-size:0.75rem; color:var(--text-muted);" id="currentDateLabel"></span>
        </div>
        <table>
          <thead>
            <tr>
              <th>종목명</th>
              <th>보유수량</th>
              <th>평단가</th>
              <th>현재가</th>
              <th>수익률</th>
            </tr>
          </thead>
          <tbody id="etfTableBody"></tbody>
        </table>
      </section>

      <!-- AI 차트 및 시장 분석 -->
      <section class="card">
        <div class="card-title">📈 포트폴리오 비중</div>
        <div class="chart-box">
          <canvas id="portfolioChart"></canvas>
        </div>
      </section>

    </main>
  </div>

  <!-- 🔑 화면 하단 Google API Key 입력 설정 영역 -->
  <footer>
    <div class="footer-content">
      <div style="color: var(--text-muted);">
        ⚙️ Google Gemini API Key 설정 (브라우저 안전 보관)
      </div>
      <div style="display: flex; gap: 0.4rem; align-items: center;">
        <input type="password" id="geminiApiKey" placeholder="Google Gemini API Key 입력" style="width: 230px;">
        <button class="btn btn-secondary" onclick="saveApiKey()">키 저장</button>
      </div>
    </div>
  </footer>

  <script>
    // 기본 포트폴리오 샘플 데이터
    const etfPortfolio = [
      { name: "KODEX 200", qty: 150, avgPrice: "34,200", currentPrice: "35,100", returnRate: "+2.63%" },
      { name: "KODEX 150", qty: 200, avgPrice: "13,100", currentPrice: "12,950", returnRate: "-1.15%" },
      { name: "QQQ", qty: 45, avgPrice: "$430.50", currentPrice: "$445.20", returnRate: "+3.41%" },
      { name: "SPY", qty: 30, avgPrice: "$510.00", currentPrice: "$522.80", returnRate: "+2.51%" }
    ];

    let myChart = null;

    // 1. 페이지 로드 시 초기화
    window.onload = function() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('baseDate').value = today;
      document.getElementById('currentDateLabel').innerText = today;

      // 저장된 API 키 복원
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('geminiApiKey').value = savedKey;
      }

      renderETFTable();
      initChart();
      fetchRealtimeMacroWithGemini(); // 구글 AI 실시간 시세 로딩
    };

    // 2. API 키 저장 기능
    function saveApiKey() {
      const key = document.getElementById('geminiApiKey').value.trim();
      if (!key) {
        alert('API 키를 입력해 주세요.');
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      alert('API 키가 성공적으로 저장되었습니다! 실시간 시세를 불러옵니다.');
      fetchRealtimeMacroWithGemini();
    }

    // 3. 날짜 변경 / 불러오기 버튼
    function fetchDataForDate() {
      const selectedDate = document.getElementById('baseDate').value;
      document.getElementById('currentDateLabel').innerText = selectedDate;
      fetchRealtimeMacroWithGemini();
    }

    // 4. 구글 Gemini API (Search Grounding) 연동
    async function fetchRealtimeMacroWithGemini() {
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('geminiApiKey').value.trim();
      const tickerContainer = document.getElementById('macroTicker');

      if (!apiKey) {
        tickerContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); padding:0.2rem;">⚠️ 하단에 Google API Key를 입력하고 [키 저장]을 눌러주세요.</div>`;
        return;
      }

      tickerContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--text-muted); padding:0.2rem;">⏳ 구글 AI가 실시간 증시 시세를 조회하는 중...</div>`;

      const prompt = `현재 시점의 코스피, 코스닥, S&P 500, 나스닥, 다우존스, 미국채 2년, 미국채 10년, WTI 유가, 원/달러 환율 최신 시세를 검색해서 아래 JSON 데이터 배열 구조로만 정확히 출력해줘. 다른 설명이나 백틱(```)은 절대 넣지마.
      [
        {"name": "코스피", "val": "수치", "change": "변동률%", "up": true},
        {"name": "코스닥", "val": "수치", "change": "변동률%", "up": false},
        {"name": "S&P 500", "val": "수치", "change": "변동률%", "up": true},
        {"name": "나스닥", "val": "수치", "change": "변동률%", "up": true},
        {"name": "다우존스", "val": "수치", "change": "변동률%", "up": false},
        {"name": "미국채 2년", "val": "수치%", "change": "변동률%", "up": false},
        {"name": "미국채 10년", "val": "수치%", "change": "변동률%", "up": true},
        {"name": "WTI 유가", "val": "$수치", "change": "변동률%", "up": true},
        {"name": "원/달러 환율", "val": "수치원", "change": "변동원", "up": false}
      ]`;

      try {
        const response = await fetch(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$){apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            tools: [{ googleSearch: {} }]
          })
        });

        const data = await response.json();
        const rawText = data.candidates[0].content.parts[0].text;
        const cleanJson = rawText.replace(/```json|```/g, "").trim();
        const macroData = JSON.parse(cleanJson);

        tickerContainer.innerHTML = macroData.map(item => `
          <div class="ticker-item">
            <span class="ticker-name">${item.name}</span>
            <span class="ticker-val ${item.up ? 'up' : 'down'}">${item.val} (${item.change})</span>
          </div>
        `).join('');

      } catch (error) {
        console.error("Gemini API 오류:", error);
        tickerContainer.innerHTML = `<div style="font-size:0.8rem; color:var(--up-red);">⚠️ 시세 수신 실패 (API 키 확인 필요)</div>`;
      }
    }

    // 5. ETF 테이블 렌더링
    function renderETFTable() {
      const tbody = document.getElementById('etfTableBody');
      tbody.innerHTML = etfPortfolio.map(item => `
        <tr>
          <td><b>${item.name}</b></td>
          <td>${item.qty}</td>
          <td>${item.avgPrice}</td>
          <td>${item.currentPrice}</td>
          <td style="color: ${item.returnRate.startsWith('+') ? 'var(--up-red)' : 'var(--down-blue)'};">${item.returnRate}</td>
        </tr>
      `).join('');
    }

    // 6. 차트 초기화
    function initChart() {
      const ctx = document.getElementById('portfolioChart').getContext('2d');
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['KODEX 200', 'KODEX 150', 'QQQ', 'SPY'],
          datasets: [{
            data: [25, 15, 35, 25],
            backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { color: '#94a3b8' } } }
        }
      });
    }
  </script>
</body>
</html>
